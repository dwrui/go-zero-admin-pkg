// 声明 proto 使用的语法版本
syntax = "proto3";

// proto 包名
package auth;

// golang 包名
option go_package = "./auth";

message CheckTokenRequest {
  string token = 1;       // 令牌
  string permission = 2;       // 权限
}

message CheckTokenResponse {
  string new_token = 1;       // 新令牌
}

message GetFieldAccessRequest{
  uint64 user_id = 1;       // 用户ID
  string table_name = 2;    // 表名
}

message GetFieldAccessResponse {
  repeated string list_visible_fields = 1;  // 列表可见字段列表，["*"]表示全部字段
  repeated string edit_visible_fields = 2;  // 表单可见字段列表
  repeated string editable_fields = 3;      // 可编辑字段列表
  repeated string readonly_fields = 4;      // 只读字段列表
  repeated string view_visible_fields = 5;  // 查看详情可见字段列表
}

message GetUserPermissionRequest {
  uint64 user_id = 1;       // 用户ID
  string table_name = 2;    // 表名（可选，不传则不返回字段权限）
}

message FieldPermission {
  repeated string list_visible_fields = 1;  // 列表可见字段列表
  repeated string edit_visible_fields = 2;  // 表单可见字段列表
  repeated string view_visible_fields = 3;  // 查看详情可见字段列表
}

message GetUserPermissionResponse {
  int64 access_type = 1;                     // 数据权限类型：0=自己，1=部门，2=全部，3=自己及以下角色
  repeated uint64 dept_id = 2;               // 部门ID
  repeated uint64 user_ids = 3;              // 用户ID列表
  FieldPermission field_permission = 4;      // 字段权限
}


service AuthService {
  rpc CheckToken(CheckTokenRequest) returns (CheckTokenResponse);
  rpc GetFieldAccess(GetFieldAccessRequest) returns (GetFieldAccessResponse);
  rpc GetUserPermission(GetUserPermissionRequest) returns (GetUserPermissionResponse);
}